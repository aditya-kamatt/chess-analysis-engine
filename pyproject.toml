[project]
name = "chess-analysis-engine"
version = "0.1.0"
description = "Self-hosted chess game analysis"
requires-python = ">=3.12"
dependencies = [
    "chess>=1.11.1",
    "fastapi>=0.115",
    "httpx>=0.28",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chess_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
