[project]
name = "chess-analysis-engine"
version = "0.1.0"
description = "Self-hosted chess game analysis"
requires-python = ">=3.12"
dependencies = [
    "chess>=1.11.1",
    "fastapi>=0.115",
    "httpx>=0.28",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chess_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["vendor", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "SIM117"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
